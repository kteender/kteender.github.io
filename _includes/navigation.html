{% for item in site.data.navigation %}
  <a href="{{ item.permalink }}" 
  {% if item.name == 'ANIMATION' and page.url == "/" %}
    class="navi-buttons-current"
  {% elsif page.url != "/" and item.permalink contains page.url %}
    class="navi-buttons-current"
  {% else %}
    class="navi-buttons"
  {% endif %} id="nav">
  {{ item.name }}</a>
{% endfor %}
